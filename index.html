<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Existencia · Colección de poemas</title>
    <!-- Tailwind CSS para estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para traducir JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (lectura de poemas.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
        }
        .font-dancing {
            font-family: 'Dancing Script', cursive;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            opacity: 0;
            animation: fade-up 0.8s ease-out forwards;
        }
        @keyframes pop-heart {
            0% { transform: scale(1); }
            40% { transform: scale(1.6); }
            100% { transform: scale(1.25); }
        }
        .animate-pop-heart {
            animation: pop-heart 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* ==================================================================
           TEMAS VISUALES
           Cada poema elige un tema: fondo de página, colores, tipografía.
           ================================================================== */
        const THEMES = {
            rosa: {
                name: "Rosa eterna",
                pageBg: "from-slate-900 via-purple-900 to-slate-900",
                cardHeader: "from-pink-500/30 to-transparent",
                accent: "text-pink-300",
                caption: "text-pink-200",
                lineA: "text-pink-50",
                lineB: "text-purple-100",
                chip: "from-pink-500 to-purple-600",
                border: "border-pink-300/30",
                blobA: "bg-pink-600",
                blobB: "bg-purple-600",
                button: "from-pink-500 to-purple-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            medianoche: {
                name: "Medianoche azul",
                pageBg: "from-slate-950 via-blue-950 to-slate-900",
                cardHeader: "from-blue-500/30 to-transparent",
                accent: "text-sky-300",
                caption: "text-sky-200",
                lineA: "text-sky-50",
                lineB: "text-blue-100",
                chip: "from-sky-500 to-indigo-600",
                border: "border-sky-300/30",
                blobA: "bg-sky-600",
                blobB: "bg-indigo-600",
                button: "from-sky-500 to-indigo-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            atardecer: {
                name: "Atardecer",
                pageBg: "from-slate-950 via-orange-950 to-slate-900",
                cardHeader: "from-amber-500/30 to-transparent",
                accent: "text-amber-300",
                caption: "text-amber-200",
                lineA: "text-amber-50",
                lineB: "text-orange-100",
                chip: "from-amber-500 to-rose-600",
                border: "border-amber-300/30",
                blobA: "bg-amber-500",
                blobB: "bg-rose-600",
                button: "from-amber-500 to-rose-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            esmeralda: {
                name: "Esmeralda",
                pageBg: "from-slate-950 via-emerald-950 to-slate-900",
                cardHeader: "from-emerald-500/30 to-transparent",
                accent: "text-emerald-300",
                caption: "text-emerald-200",
                lineA: "text-emerald-50",
                lineB: "text-teal-100",
                chip: "from-emerald-500 to-teal-600",
                border: "border-emerald-300/30",
                blobA: "bg-emerald-600",
                blobB: "bg-teal-600",
                button: "from-emerald-500 to-teal-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            sepia: {
                name: "Papel antiguo",
                pageBg: "from-stone-900 via-yellow-950 to-stone-900",
                cardHeader: "from-yellow-500/25 to-transparent",
                accent: "text-yellow-200",
                caption: "text-yellow-200/80",
                lineA: "text-amber-100",
                lineB: "text-stone-200",
                chip: "from-yellow-600 to-stone-600",
                border: "border-yellow-200/25",
                blobA: "bg-yellow-700",
                blobB: "bg-stone-600",
                button: "from-yellow-600 to-stone-600",
                titleFont: "font-['Playfair_Display',serif]",
                bodyFont: "font-['Playfair_Display',serif]",
            },
        };

        /* ==================================================================
           POEMAS DESDE EXCEL (poemas.xlsx)
           El .xlsx es la única fuente de verdad de la colección:
             Hoja "Poemas": id, title, dedicatory, author, theme, badge, columns
             Hoja "Versos": poem_id, line_no, text
           Edítalo en Excel, Google Sheets o LibreOffice y recarga la página.
           Puedes regenerarlo con: python tools/generate_poemas.py
           ================================================================== */
        const XLSX_FILE = "poemas.xlsx";
        const BOOL_TRUE = new Set(["sí", "si", "yes", "true", "1"]);

        const slugify = (text) =>
            (String(text).toLowerCase().match(/[a-z0-9]+/g) || []).join("-") || "poema";

        // Convierte un libro de Excel en la lista de objetos de poema
        const poemsFromWorkbook = (workbook) => {
            const poemSheet = workbook.Sheets["Poemas"];
            const verseSheet = workbook.Sheets["Versos"];
            if (!poemSheet) throw new Error('Falta la hoja "Poemas" en el Excel');

            const poemRows = XLSX.utils.sheet_to_json(poemSheet, { defval: "" });
            const verseRows = verseSheet ? XLSX.utils.sheet_to_json(verseSheet, { defval: "" }) : [];

            // Agrupar versos por poem_id y ordenarlos por line_no
            const linesByPoem = {};
            verseRows.forEach((v) => {
                const pid = String(v.poem_id || "").trim();
                if (!pid) return;
                if (!linesByPoem[pid]) linesByPoem[pid] = [];
                linesByPoem[pid].push({
                    n: parseInt(v.line_no, 10) || 0,
                    text: v.text != null ? String(v.text) : "",
                });
            });
            Object.keys(linesByPoem).forEach((pid) => {
                linesByPoem[pid].sort((a, b) => a.n - b.n);
                linesByPoem[pid] = linesByPoem[pid].map((l) => l.text);
            });

            return poemRows
                .filter((row) => String(row.title || "").trim())
                .map((row) => {
                    const id = String(row.id || "").trim() || slugify(row.title);
                    return {
                        id: id,
                        title: String(row.title).trim(),
                        dedicatory: String(row.dedicatory || "").trim(),
                        author: String(row.author || "").trim() || "Anónimo",
                        theme: THEMES[row.theme] ? row.theme : "rosa",
                        lines: linesByPoem[id] || [],
                        badge: String(row.badge || "").trim() || null,
                        twoCol: BOOL_TRUE.has(String(row.columns || "").trim().toLowerCase()),
                    };
                });
        };

        // Descarga y lee poemas.xlsx
        const loadPoemsFromXlsx = async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error("No se pudo leer " + url);
            const workbook = XLSX.read(await res.arrayBuffer(), { type: "array" });
            return poemsFromWorkbook(workbook);
        };

        /* ==================================================================
           ICONOS SVG
           ================================================================== */
        const HeartIcon = ({ filled, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );

        const ShareIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
        );

        const FeatherIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/>
            </svg>
        );

        const BackIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
        );

        const SheetIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
        );

        /* ==================================================================
           FONDO DECORATIVO (reacciona al tema del poema actual)
           ================================================================== */
        const Backdrop = ({ themeKey }) => {
            const t = THEMES[themeKey] || THEMES.rosa;
            return (
                <React.Fragment>
                    <div className={`fixed inset-0 bg-gradient-to-br ${t.pageBg} transition-all duration-1000`}></div>
                    <div className="fixed inset-0 pointer-events-none overflow-hidden">
                        <div className={`absolute top-[-10%] left-[-10%] w-64 h-64 ${t.blobA} rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-float transition-colors duration-1000`}></div>
                        <div className={`absolute bottom-[-10%] right-[-10%] w-64 h-64 ${t.blobB} rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-float transition-colors duration-1000`} style={{ animationDelay: "2s" }}></div>
                    </div>
                </React.Fragment>
            );
        };

        /* ==================================================================
           TARJETA DEL MENÚ (un poema)
           ================================================================== */
        const PoemCard = ({ poem, index, onOpen }) => {
            const t = THEMES[poem.theme] || THEMES.rosa;
            const preview = poem.lines.filter((l) => l.trim()).slice(0, 3);
            return (
                <div
                    onClick={() => onOpen(poem.id)}
                    className={`animate-fade-up group relative cursor-pointer overflow-hidden rounded-3xl bg-white/10 backdrop-blur-md shadow-2xl border ${t.border} transition-all duration-500 hover:scale-[1.03] hover:bg-white/15`}
                    style={{ animationDelay: `${index * 90}ms` }}
                >
                    {/* Franja superior con el tema del poema */}
                    <div className={`h-2 w-full bg-gradient-to-r ${t.chip}`}></div>

                    {/* Cabecera */}
                    <div className={`h-32 bg-gradient-to-b ${t.cardHeader} flex items-center justify-center relative`}>
                        {poem.badge ? (
                            <div className={`text-6xl font-bold ${t.accent} animate-pulse`}>{poem.badge}</div>
                        ) : (
                            <div className="transition-transform duration-700 group-hover:rotate-12">
                                <FeatherIcon className={`${t.accent} opacity-80`} />
                            </div>
                        )}
                    </div>

                    {/* Cuerpo */}
                    <div className="px-6 pb-6 pt-2 text-center">
                        <h2 className={`text-2xl ${t.titleFont} ${t.accent} mb-1`}>{poem.title}</h2>
                        {poem.dedicatory && (
                            <p className={`font-dancing italic text-sm ${t.caption} opacity-90 mb-3`}>{poem.dedicatory}</p>
                        )}
                        <div className="space-y-1 mb-4">
                            {preview.map((line, i) => (
                                <p key={i} className={`text-sm leading-snug ${i % 2 === 0 ? t.lineA : t.lineB} opacity-80`}>
                                    {line}
                                </p>
                            ))}
                            <p className={`text-sm ${t.lineB} opacity-40 italic`}>…</p>
                        </div>
                        <span className={`inline-block bg-gradient-to-r ${t.button} text-white text-sm font-medium px-5 py-2 rounded-full transition-transform duration-300 group-hover:scale-105`}>
                            Leer poema
                        </span>
                        <p className="mt-3 text-xs text-white/40">— {poem.author}</p>
                    </div>
                </div>
            );
        };

        /* ==================================================================
           VISTA LECTOR (un poema, con animación verso a verso)
           ================================================================== */
        const Reader = ({ poem, liked, onToggleLike, onBack, showToast }) => {
            const [visibleLines, setVisibleLines] = useState(0);
            const t = THEMES[poem.theme] || THEMES.rosa;

            useEffect(() => {
                setVisibleLines(0);
                const speed = poem.lines.length > 25 ? 400 : 800;
                const timer = setInterval(() => {
                    setVisibleLines((prev) => (prev < poem.lines.length ? prev + 1 : prev));
                }, speed);
                return () => clearInterval(timer);
            }, [poem.id]);

            const handleShare = () => {
                const fullPoem = `${poem.title}\n\n${poem.lines.filter((l) => l.trim()).join("\n")}`;
                if (navigator.share) {
                    navigator.share({ title: poem.title, text: fullPoem }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(fullPoem).then(() => showToast("Poema copiado ✨"));
                }
            };

            // Pares de versos para poemas a dos columnas
            const rows = [];
            if (poem.twoCol) {
                for (let i = 0; i < poem.lines.length; i += 2) {
                    rows.push({
                        left: { text: poem.lines[i], index: i },
                        right: i + 1 < poem.lines.length ? { text: poem.lines[i + 1], index: i + 1 } : null,
                    });
                }
            }

            return (
                <div className="relative z-10 w-full max-w-4xl bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl border border-white/10 overflow-hidden transition-all duration-500">
                    {/* Volver */}
                    <button
                        onClick={onBack}
                        className="absolute top-4 left-4 z-20 p-2 rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-95"
                        title="Volver al menú"
                    >
                        <BackIcon className="text-white" />
                    </button>

                    {/* Cabecera con título y dedicatoria */}
                    <div className={`h-44 bg-gradient-to-b ${t.cardHeader} flex items-center justify-center flex-col relative px-14`}>
                        {poem.badge ? (
                            <div className={`text-7xl font-bold ${t.accent} animate-pulse`}>{poem.badge}</div>
                        ) : (
                            <div className="animate-float">
                                <FeatherIcon className={`${t.accent} opacity-80`} />
                            </div>
                        )}
                        <h1 className={`mt-3 text-4xl ${t.titleFont} ${t.accent}`}>{poem.title}</h1>
                        {poem.dedicatory && (
                            <div className={`mt-2 font-dancing italic text-sm md:text-base ${t.caption} uppercase tracking-[0.2em] opacity-90 text-center`}>
                                {poem.dedicatory}
                            </div>
                        )}
                        <div className="mt-1 text-xs text-white/50">— {poem.author}</div>
                    </div>

                    {/* Contenido */}
                    <div className="px-4 md:px-8 pb-8 pt-4 min-h-[300px] flex flex-col items-center text-center">
                        {poem.twoCol ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 w-full">
                                {rows.map((row, rowIndex) => {
                                    const isLastRow = rowIndex === rows.length - 1;
                                    return (
                                        <React.Fragment key={rowIndex}>
                                            <p
                                                className={`text-base md:text-lg leading-relaxed transition-all duration-1000 ease-out transform
                                                    ${row.left.index < visibleLines ? "opacity-100 translate-y-0 blur-0" : "opacity-0 translate-y-8 blur-sm"}
                                                    ${row.left.index % 2 === 0 ? t.lineA : t.lineB}
                                                    ${isLastRow && !row.right ? "md:col-span-2 text-center" : "text-left md:text-right"}`}
                                            >
                                                {row.left.text}
                                            </p>
                                            {row.right && (
                                                <p
                                                    className={`text-base md:text-lg leading-relaxed transition-all duration-1000 ease-out transform text-left
                                                        ${row.right.index < visibleLines ? "opacity-100 translate-y-0 blur-0" : "opacity-0 translate-y-8 blur-sm"}
                                                        ${row.right.index % 2 === 0 ? t.lineA : t.lineB}`}
                                                >
                                                    {row.right.text}
                                                </p>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </div>
                        ) : (
                            poem.lines.map((line, index) => {
                                if (!line.trim()) return <div key={index} className="h-6 w-full"></div>;
                                return (
                                    <p
                                        key={index}
                                        className={`text-lg md:text-xl leading-relaxed transition-all duration-1000 ease-out transform w-full
                                            ${index < visibleLines ? "opacity-100 translate-y-0 blur-0" : "opacity-0 translate-y-8 blur-sm"}
                                            ${index % 2 === 0 ? t.lineA : t.lineB}`}
                                    >
                                        {line}
                                    </p>
                                );
                            })
                        )}
                    </div>

                    {/* Acciones */}
                    <div className="bg-black/20 p-4 flex flex-col md:flex-row justify-between items-center gap-4 backdrop-blur-lg border-t border-white/5">
                        <div className="flex gap-2">
                            <button
                                onClick={onToggleLike}
                                className="flex items-center gap-2 px-6 py-2 rounded-full hover:bg-white/10 transition-all active:scale-95 group"
                            >
                                <div className={`transition-transform duration-300 ${liked ? "scale-125" : "group-hover:scale-110"}`}>
                                    <HeartIcon filled={liked} className={liked ? "text-red-500 animate-pop-heart" : "text-white"} />
                                </div>
                                <span className={`text-sm font-medium transition-colors ${liked ? "text-red-200" : "text-white"}`}>
                                    {liked ? "Lo siento" : "Love"}
                                </span>
                            </button>

                            <button
                                onClick={handleShare}
                                className="flex items-center gap-2 px-6 py-2 rounded-full hover:bg-white/10 transition-all active:scale-95"
                            >
                                <ShareIcon className="text-white" />
                                <span className="text-sm font-medium text-white">Compartir</span>
                            </button>
                        </div>

                        <button
                            onClick={onBack}
                            className="flex items-center gap-2 px-6 py-2 rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-95"
                        >
                            <BackIcon className="text-white" />
                            <span className="text-sm font-medium text-white">Volver al Inicio</span>
                        </button>
                    </div>
                </div>
            );
        };

        /* ==================================================================
           APP PRINCIPAL
           ================================================================== */
        const App = () => {
            const [view, setView] = useState("menu"); // 'menu' | 'reader'
            const [poemId, setPoemId] = useState(null);
            const [poems, setPoems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [likes, setLikes] = useState(() => {
                try { return JSON.parse(localStorage.getItem("poem_likes") || "{}"); }
                catch (e) { return {}; }
            });

            const showToast = (msg) => setToast({ msg, id: Date.now() });

            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(null), 2600);
                return () => clearTimeout(t);
            }, [toast]);

            // Carga inicial: los objetos de poema salen de poemas.xlsx
            useEffect(() => {
                let alive = true;
                (async () => {
                    try {
                        const loaded = await loadPoemsFromXlsx(XLSX_FILE);
                        if (alive) setPoems(loaded);
                    } catch (err) {
                        console.error(err);
                        if (alive) showToast("No se pudo leer poemas.xlsx");
                    } finally {
                        if (alive) setLoading(false);
                    }
                })();
                return () => { alive = false; };
            }, []);

            const toggleLike = (id) => {
                setLikes((prev) => {
                    const next = { ...prev, [id]: !prev[id] };
                    localStorage.setItem("poem_likes", JSON.stringify(next));
                    return next;
                });
            };

            const currentPoem = poems.find((p) => p.id === poemId);
            const themeKey = view === "reader" && currentPoem ? currentPoem.theme : "rosa";

            // Carga poemas desde un archivo .xlsx elegido por el usuario
            const handleUploadXlsx = async (file) => {
                try {
                    const imported = poemsFromWorkbook(XLSX.read(await file.arrayBuffer(), { type: "array" }));
                    if (!imported.length) { showToast("El Excel no contiene poemas"); return; }
                    setPoems(imported);
                    setView("menu");
                    setPoemId(null);
                    showToast(`Cargados ${imported.length} poemas del Excel`);
                } catch (err) {
                    console.error(err);
                    showToast("No se pudo leer el Excel");
                }
            };

            return (
                <div className="min-h-screen relative flex flex-col items-center p-4 md:p-8">
                    <Backdrop themeKey={themeKey} />

                    {/* Barra superior */}
                    <header className="relative z-10 w-full max-w-5xl flex flex-col md:flex-row justify-between items-center gap-3 mb-8">
                        <button
                            onClick={() => setView("menu")}
                            className="flex items-center gap-3 group"
                        >
                            <FeatherIcon className="text-pink-300 opacity-80 w-8 h-8 transition-transform duration-700 group-hover:rotate-12" />
                            <div className="text-left">
                                <div className="text-xl font-dancing text-white/90 leading-none">Tu Existencia</div>
                                <div className="text-[10px] uppercase tracking-[0.25em] text-pink-200/60">Colección de poemas</div>
                            </div>
                        </button>

                        {/* Cargar Excel: reemplaza la colección en esta sesión */}
                        <label className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 font-medium text-sm transition-all active:scale-95 cursor-pointer">
                            <SheetIcon className="w-4 h-4" />
                            Cargar Excel
                            <input
                                type="file"
                                accept=".xlsx,.xls"
                                className="hidden"
                                onChange={(e) => {
                                    const file = e.target.files && e.target.files[0];
                                    if (file) handleUploadXlsx(file);
                                    e.target.value = "";
                                }}
                            />
                        </label>
                    </header>

                    {/* Contenido por vista */}
                    {view === "menu" && (
                        <main className="relative z-10 w-full max-w-5xl">
                            {loading ? (
                                <div className="flex justify-center py-20">
                                    <div className="animate-float text-center">
                                        <FeatherIcon className="text-pink-300 opacity-70 mx-auto" />
                                        <p className="mt-4 text-white/50 font-dancing text-xl">Abriendo el libro de poemas…</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {poems.map((poem, i) => (
                                        <PoemCard
                                            key={poem.id}
                                            poem={poem}
                                            index={i}
                                            onOpen={(id) => { setPoemId(id); setView("reader"); }}
                                        />
                                    ))}
                                    {!poems.length && (
                                        <div className="animate-fade-up rounded-3xl border border-dashed border-white/20 flex flex-col items-center justify-center p-8 text-center text-white/40">
                                            <SheetIcon className="w-8 h-8 mb-3" />
                                            <p className="text-sm">Añade poemas editando poemas.xlsx o con “Cargar Excel”</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                    )}

                    {view === "reader" && currentPoem && (
                        <main className="relative z-10 w-full flex justify-center">
                            <Reader
                                poem={currentPoem}
                                liked={!!likes[currentPoem.id]}
                                onToggleLike={() => toggleLike(currentPoem.id)}
                                onBack={() => setView("menu")}
                                showToast={showToast}
                            />
                        </main>
                    )}

                    {/* Pie */}
                    <div className="relative z-10 mt-10 mb-4 text-white/20 text-xs text-center font-light">
                        Hecho con el corazón
                    </div>

                    {/* Toast */}
                    <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-purple-900 px-6 py-3 rounded-full shadow-2xl font-medium transform transition-all duration-500 z-[60]
                        ${toast ? "translate-y-0 opacity-100 scale-100" : "translate-y-20 opacity-0 scale-95"}`}>
                        {toast ? toast.msg : ""}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
