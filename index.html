<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Existencia · Colección de poemas</title>
    <!-- Tailwind CSS para estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para traducir JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase (base de datos + autenticación) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (lectura de poemas.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
        }
        .font-dancing {
            font-family: 'Dancing Script', cursive;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            opacity: 0;
            animation: fade-up 0.8s ease-out forwards;
        }
        @keyframes pop-heart {
            0% { transform: scale(1); }
            40% { transform: scale(1.6); }
            100% { transform: scale(1.25); }
        }
        .animate-pop-heart {
            animation: pop-heart 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* ==================================================================
           CONFIGURACIÓN DE SUPABASE
           1. Crea un proyecto gratis en https://supabase.com
           2. Ejecuta el SQL de `supabase-setup.sql` en el SQL Editor.
           3. Pega aquí tus credenciales (Dashboard → Settings → API):
              - Project URL
              - anon public key
           Mientras estén los placeholders, la página funciona en "modo
           local": los poemas salen de poemas.xlsx, sin login ni publicar.
           ================================================================== */
        const SUPABASE_URL = "PON_AQUI_TU_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "PON_AQUI_TU_SUPABASE_ANON_KEY";

        const db = (() => {
            try {
                if (typeof window.supabase === "undefined") return null;
                if (!SUPABASE_URL.startsWith("https://") || SUPABASE_ANON_KEY.length < 30) return null;
                return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.error("No se pudo inicializar Supabase:", e);
                return null;
            }
        })();

        /* ==================================================================
           TEMAS VISUALES
           Cada poema elige un tema: fondo de página, colores, tipografía.
           ================================================================== */
        const THEMES = {
            rosa: {
                name: "Rosa eterna",
                pageBg: "from-slate-900 via-purple-900 to-slate-900",
                cardHeader: "from-pink-500/30 to-transparent",
                accent: "text-pink-300",
                caption: "text-pink-200",
                lineA: "text-pink-50",
                lineB: "text-purple-100",
                chip: "from-pink-500 to-purple-600",
                border: "border-pink-300/30",
                blobA: "bg-pink-600",
                blobB: "bg-purple-600",
                button: "from-pink-500 to-purple-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            medianoche: {
                name: "Medianoche azul",
                pageBg: "from-slate-950 via-blue-950 to-slate-900",
                cardHeader: "from-blue-500/30 to-transparent",
                accent: "text-sky-300",
                caption: "text-sky-200",
                lineA: "text-sky-50",
                lineB: "text-blue-100",
                chip: "from-sky-500 to-indigo-600",
                border: "border-sky-300/30",
                blobA: "bg-sky-600",
                blobB: "bg-indigo-600",
                button: "from-sky-500 to-indigo-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            atardecer: {
                name: "Atardecer",
                pageBg: "from-slate-950 via-orange-950 to-slate-900",
                cardHeader: "from-amber-500/30 to-transparent",
                accent: "text-amber-300",
                caption: "text-amber-200",
                lineA: "text-amber-50",
                lineB: "text-orange-100",
                chip: "from-amber-500 to-rose-600",
                border: "border-amber-300/30",
                blobA: "bg-amber-500",
                blobB: "bg-rose-600",
                button: "from-amber-500 to-rose-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            esmeralda: {
                name: "Esmeralda",
                pageBg: "from-slate-950 via-emerald-950 to-slate-900",
                cardHeader: "from-emerald-500/30 to-transparent",
                accent: "text-emerald-300",
                caption: "text-emerald-200",
                lineA: "text-emerald-50",
                lineB: "text-teal-100",
                chip: "from-emerald-500 to-teal-600",
                border: "border-emerald-300/30",
                blobA: "bg-emerald-600",
                blobB: "bg-teal-600",
                button: "from-emerald-500 to-teal-600",
                titleFont: "font-dancing",
                bodyFont: "font-dancing",
            },
            sepia: {
                name: "Papel antiguo",
                pageBg: "from-stone-900 via-yellow-950 to-stone-900",
                cardHeader: "from-yellow-500/25 to-transparent",
                accent: "text-yellow-200",
                caption: "text-yellow-200/80",
                lineA: "text-amber-100",
                lineB: "text-stone-200",
                chip: "from-yellow-600 to-stone-600",
                border: "border-yellow-200/25",
                blobA: "bg-yellow-700",
                blobB: "bg-stone-600",
                button: "from-yellow-600 to-stone-600",
                titleFont: "font-['Playfair_Display',serif]",
                bodyFont: "font-['Playfair_Display',serif]",
            },
        };

        const THEME_KEYS = Object.keys(THEMES);

        /* ==================================================================
           POEMAS DESDE EXCEL (poemas.xlsx)
           El .xlsx es la fuente de verdad de la colección:
             Hoja "Poemas": id, title, dedicatory, author, theme, badge, columns
             Hoja "Versos": poem_id, line_no, text
           Edítalo en Excel, Google Sheets o LibreOffice y recarga la página.
           Puedes regenerarlo con: python tools/generate_poemas.py
           ================================================================== */
        const XLSX_FILE = "poemas.xlsx";
        const BOOL_TRUE = new Set(["sí", "si", "yes", "true", "1"]);

        const slugify = (text) =>
            (String(text).toLowerCase().match(/[a-z0-9]+/g) || []).join("-") || "poema";

        // Convierte un libro de Excel en la lista de objetos de poema
        const poemsFromWorkbook = (workbook) => {
            const poemSheet = workbook.Sheets["Poemas"];
            const verseSheet = workbook.Sheets["Versos"];
            if (!poemSheet) throw new Error('Falta la hoja "Poemas" en el Excel');

            const poemRows = XLSX.utils.sheet_to_json(poemSheet, { defval: "" });
            const verseRows = verseSheet ? XLSX.utils.sheet_to_json(verseSheet, { defval: "" }) : [];

            // Agrupar versos por poem_id y ordenarlos por line_no
            const linesByPoem = {};
            verseRows.forEach((v) => {
                const pid = String(v.poem_id || "").trim();
                if (!pid) return;
                if (!linesByPoem[pid]) linesByPoem[pid] = [];
                linesByPoem[pid].push({
                    n: parseInt(v.line_no, 10) || 0,
                    text: v.text != null ? String(v.text) : "",
                });
            });
            Object.keys(linesByPoem).forEach((pid) => {
                linesByPoem[pid].sort((a, b) => a.n - b.n);
                linesByPoem[pid] = linesByPoem[pid].map((l) => l.text);
            });

            return poemRows
                .filter((row) => String(row.title || "").trim())
                .map((row) => {
                    const id = String(row.id || "").trim() || slugify(row.title);
                    return {
                        id: id,
                        title: String(row.title).trim(),
                        dedicatory: String(row.dedicatory || "").trim(),
                        author: String(row.author || "").trim() || "Anónimo",
                        theme: THEMES[row.theme] ? row.theme : "rosa",
                        lines: linesByPoem[id] || [],
                        badge: String(row.badge || "").trim() || null,
                        twoCol: BOOL_TRUE.has(String(row.columns || "").trim().toLowerCase()),
                        userId: null,
                    };
                });
        };

        // Descarga y lee poemas.xlsx
        const loadPoemsFromXlsx = async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error("No se pudo leer " + url);
            const workbook = XLSX.read(await res.arrayBuffer(), { type: "array" });
            return poemsFromWorkbook(workbook);
        };

        // Normaliza una fila de la tabla de Supabase a un objeto de poema
        const normalizeDbRow = (r) => ({
            id: r.id,
            title: r.title,
            dedicatory: r.dedicatory || "",
            author: r.author || "Anónimo",
            theme: THEMES[r.theme] ? r.theme : "rosa",
            lines: Array.isArray(r.lines) ? r.lines : [],
            badge: r.badge || null,
            twoCol: !!r.columns,
            userId: r.user_id || null,
        });

        // Convierte un objeto de poema (del Excel) al formato de la tabla
        const poemToDbRow = (p) => ({
            title: p.title,
            dedicatory: p.dedicatory || null,
            author: p.author || "Anónimo",
            theme: p.theme,
            lines: p.lines,
            badge: p.badge,
            columns: p.twoCol,
        });

        /* ==================================================================
           ICONOS SVG
           ================================================================== */
        const HeartIcon = ({ filled, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );

        const ShareIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
        );

        const FeatherIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/>
            </svg>
        );

        const BackIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
        );

        const PenIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
        );

        const UserIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        );

        const TrashIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
        );

        const CloseIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        );

        const SheetIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
        );

        /* ==================================================================
           FONDO DECORATIVO (reacciona al tema del poema actual)
           ================================================================== */
        const Backdrop = ({ themeKey }) => {
            const t = THEMES[themeKey] || THEMES.rosa;
            return (
                <React.Fragment>
                    <div className={`fixed inset-0 bg-gradient-to-br ${t.pageBg} transition-all duration-1000`}></div>
                    <div className="fixed inset-0 pointer-events-none overflow-hidden">
                        <div className={`absolute top-[-10%] left-[-10%] w-64 h-64 ${t.blobA} rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-float transition-colors duration-1000`}></div>
                        <div className={`absolute bottom-[-10%] right-[-10%] w-64 h-64 ${t.blobB} rounded-full mix-blend-multiply filter blur-[100px] opacity-30 animate-float transition-colors duration-1000`} style={{ animationDelay: "2s" }}></div>
                    </div>
                </React.Fragment>
            );
        };

        /* ==================================================================
           TARJETA DEL MENÚ (un poema)
           ================================================================== */
        const PoemCard = ({ poem, index, onOpen }) => {
            const t = THEMES[poem.theme] || THEMES.rosa;
            const preview = poem.lines.filter((l) => l.trim()).slice(0, 3);
            return (
                <div
                    onClick={() => onOpen(poem.id)}
                    className={`animate-fade-up group relative cursor-pointer overflow-hidden rounded-3xl bg-white/10 backdrop-blur-md shadow-2xl border ${t.border} transition-all duration-500 hover:scale-[1.03] hover:bg-white/15`}
                    style={{ animationDelay: `${index * 90}ms` }}
                >
                    {/* Franja superior con el tema del poema */}
                    <div className={`h-2 w-full bg-gradient-to-r ${t.chip}`}></div>

                    {/* Cabecera */}
                    <div className={`h-32 bg-gradient-to-b ${t.cardHeader} flex items-center justify-center relative`}>
                        {poem.badge ? (
                            <div className={`text-6xl font-bold ${t.accent} animate-pulse`}>{poem.badge}</div>
                        ) : (
                            <div className="transition-transform duration-700 group-hover:rotate-12">
                                <FeatherIcon className={`${t.accent} opacity-80`} />
                            </div>
                        )}
                    </div>

                    {/* Cuerpo */}
                    <div className="px-6 pb-6 pt-2 text-center">
                        <h2 className={`text-2xl ${t.titleFont} ${t.accent} mb-1`}>{poem.title}</h2>
                        {poem.dedicatory && (
                            <p className={`font-dancing italic text-sm ${t.caption} opacity-90 mb-3`}>{poem.dedicatory}</p>
                        )}
                        <div className="space-y-1 mb-4">
                            {preview.map((line, i) => (
                                <p key={i} className={`text-sm leading-snug ${i % 2 === 0 ? t.lineA : t.lineB} opacity-80`}>
                                    {line}
                                </p>
                            ))}
                            <p className={`text-sm ${t.lineB} opacity-40 italic`}>…</p>
                        </div>
                        <span className={`inline-block bg-gradient-to-r ${t.button} text-white text-sm font-medium px-5 py-2 rounded-full transition-transform duration-300 group-hover:scale-105`}>
                            Leer poema
                        </span>
                        <p className="mt-3 text-xs text-white/40">— {poem.author}</p>
                    </div>
                </div>
            );
        };

        /* ==================================================================
           MODAL DE AUTENTICACIÓN
           ================================================================== */
        const AuthModal = ({ mode, onClose, onSwitchMode, onAuthed, showToast }) => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState("");

            const isLogin = mode === "login";

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                if (!db) { showToast("Configura Supabase en index.html primero"); return; }
                setBusy(true);
                try {
                    if (isLogin) {
                        const { error } = await db.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        showToast("Bienvenida de vuelta ✨");
                        onAuthed();
                    } else {
                        const { data, error } = await db.auth.signUp({ email, password });
                        if (error) throw error;
                        if (data.session) {
                            showToast("Cuenta creada ✨");
                            onAuthed();
                        } else {
                            showToast("Cuenta creada. Revisa tu correo para confirmarla.");
                            onSwitchMode("login");
                        }
                    }
                } catch (err) {
                    setError(err.message || "Algo salió mal");
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
                    <div
                        className="w-full max-w-sm bg-slate-900/90 border border-white/10 rounded-3xl shadow-2xl p-8 animate-fade-up"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-2xl font-dancing text-pink-300">
                                {isLogin ? "Iniciar sesión" : "Crear cuenta"}
                            </h3>
                            <button onClick={onClose} className="text-white/50 hover:text-white transition-colors">
                                <CloseIcon />
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input
                                type="email"
                                required
                                placeholder="Tu correo"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                className="w-full bg-white/10 rounded-xl px-4 py-3 placeholder-white/40 outline-none focus:ring-2 focus:ring-pink-400 transition"
                            />
                            <input
                                type="password"
                                required
                                minLength={6}
                                placeholder="Contraseña (mínimo 6 caracteres)"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                className="w-full bg-white/10 rounded-xl px-4 py-3 placeholder-white/40 outline-none focus:ring-2 focus:ring-pink-400 transition"
                            />

                            {error && <p className="text-rose-300 text-sm">{error}</p>}

                            <button
                                type="submit"
                                disabled={busy}
                                className="w-full bg-gradient-to-r from-pink-500 to-purple-600 py-3 rounded-xl font-medium hover:from-pink-600 hover:to-purple-700 transition-all active:scale-95 disabled:opacity-50"
                            >
                                {busy ? "Un momento…" : isLogin ? "Entrar" : "Crear cuenta"}
                            </button>
                        </form>

                        <p className="mt-5 text-center text-sm text-white/50">
                            {isLogin ? "¿Aún no tienes cuenta?" : "¿Ya tienes cuenta?"}{" "}
                            <button
                                onClick={() => { setError(""); onSwitchMode(isLogin ? "signup" : "login"); }}
                                className="text-pink-300 hover:text-pink-200 underline underline-offset-2"
                            >
                                {isLogin ? "Crear cuenta" : "Iniciar sesión"}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        /* ==================================================================
           VISTA LECTOR (un poema, con animación verso a verso)
           ================================================================== */
        const Reader = ({ poem, session, liked, onToggleLike, onBack, onDelete, showToast }) => {
            const [visibleLines, setVisibleLines] = useState(0);
            const t = THEMES[poem.theme] || THEMES.rosa;

            useEffect(() => {
                setVisibleLines(0);
                const speed = poem.lines.length > 25 ? 400 : 800;
                const timer = setInterval(() => {
                    setVisibleLines((prev) => (prev < poem.lines.length ? prev + 1 : prev));
                }, speed);
                return () => clearInterval(timer);
            }, [poem.id]);

            const handleShare = () => {
                const fullPoem = `${poem.title}\n\n${poem.lines.filter((l) => l.trim()).join("\n")}`;
                if (navigator.share) {
                    navigator.share({ title: poem.title, text: fullPoem }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(fullPoem).then(() => showToast("Poema copiado ✨"));
                }
            };

            const canDelete = db && session && poem.userId && session.id === poem.userId;

            // Pares de versos para poemas a dos columnas
            const rows = [];
            if (poem.twoCol) {
                for (let i = 0; i < poem.lines.length; i += 2) {
                    rows.push({
                        left: { text: poem.lines[i], index: i },
                        right: i + 1 < poem.lines.length ? { text: poem.lines[i + 1], index: i + 1 } : null,
                    });
                }
            }

            return (
                <div className="relative z-10 w-full max-w-4xl bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl border border-white/10 overflow-hidden transition-all duration-500">
                    {/* Volver */}
                    <button
                        onClick={onBack}
                        className="absolute top-4 left-4 z-20 p-2 rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-95"
                        title="Volver al menú"
                    >
                        <BackIcon className="text-white" />
                    </button>

                    {/* Cabecera con título y dedicatoria */}
                    <div className={`h-44 bg-gradient-to-b ${t.cardHeader} flex items-center justify-center flex-col relative px-14`}>
                        {poem.badge ? (
                            <div className={`text-7xl font-bold ${t.accent} animate-pulse`}>{poem.badge}</div>
                        ) : (
                            <div className="animate-float">
                                <FeatherIcon className={`${t.accent} opacity-80`} />
                            </div>
                        )}
                        <h1 className={`mt-3 text-4xl ${t.titleFont} ${t.accent}`}>{poem.title}</h1>
                        {poem.dedicatory && (
                            <div className={`mt-2 font-dancing italic text-sm md:text-base ${t.caption} uppercase tracking-[0.2em] opacity-90 text-center`}>
                                {poem.dedicatory}
                            </div>
                        )}
                        <div className="mt-1 text-xs text-white/50">— {poem.author}</div>
                    </div>

                    {/* Contenido */}
                    <div className="px-4 md:px-8 pb-8 pt-4 min-h-[300px] flex flex-col items-center text-center">
                        {poem.twoCol ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 w-full">
                                {rows.map((row, rowIndex) => {
                                    const isLastRow = rowIndex === rows.length - 1;
                                    return (
                                        <React.Fragment key={rowIndex}>
                                            <p
                                                className={`text-base md:text-lg leading-relaxed transition-all duration-1000 ease-out transform
                                                    ${row.left.index < visibleLines ? "opacity-100 translate-y-0 blur-0" : "opacity-0 translate-y-8 blur-sm"}
                                                    ${row.left.index % 2 === 0 ? t.lineA : t.lineB}
                                                    ${isLastRow && !row.right ? "md:col-span-2 text-center" : "text-left md:text-right"}`}
                                            >
                                                {row.left.text}
                                            </p>
                                            {row.right && (
                                                <p
                                                    className={`text-base md:text-lg leading-relaxed transition-all duration-1000 ease-out transform text-left
                                                        ${row.right.index < visibleLines ? "opacity-100 translate-y-0 blur-0" : "opacity-0 translate-y-8 blur-sm"}
                                                        ${row.right.index % 2 === 0 ? t.lineA : t.lineB}`}
                                                >
                                                    {row.right.text}
                                                </p>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </div>
                        ) : (
                            poem.lines.map((line, index) => {
                                if (!line.trim()) return <div key={index} className="h-6 w-full"></div>;
                                return (
                                    <p
                                        key={index}
                                        className={`text-lg md:text-xl leading-relaxed transition-all duration-1000 ease-out transform w-full
                                            ${index < visibleLines ? "opacity-100 translate-y-0 blur-0" : "opacity-0 translate-y-8 blur-sm"}
                                            ${index % 2 === 0 ? t.lineA : t.lineB}`}
                                    >
                                        {line}
                                    </p>
                                );
                            })
                        )}
                    </div>

                    {/* Acciones */}
                    <div className="bg-black/20 p-4 flex flex-col md:flex-row justify-between items-center gap-4 backdrop-blur-lg border-t border-white/5">
                        <div className="flex gap-2">
                            <button
                                onClick={onToggleLike}
                                className="flex items-center gap-2 px-6 py-2 rounded-full hover:bg-white/10 transition-all active:scale-95 group"
                            >
                                <div className={`transition-transform duration-300 ${liked ? "scale-125" : "group-hover:scale-110"}`}>
                                    <HeartIcon filled={liked} className={liked ? "text-red-500 animate-pop-heart" : "text-white"} />
                                </div>
                                <span className={`text-sm font-medium transition-colors ${liked ? "text-red-200" : "text-white"}`}>
                                    {liked ? "Lo siento" : "Love"}
                                </span>
                            </button>

                            <button
                                onClick={handleShare}
                                className="flex items-center gap-2 px-6 py-2 rounded-full hover:bg-white/10 transition-all active:scale-95"
                            >
                                <ShareIcon className="text-white" />
                                <span className="text-sm font-medium text-white">Compartir</span>
                            </button>

                            {canDelete && (
                                <button
                                    onClick={() => {
                                        if (window.confirm("¿Borrar este poema para siempre?")) onDelete();
                                    }}
                                    className="flex items-center gap-2 px-4 py-2 rounded-full hover:bg-rose-500/20 text-rose-300 transition-all active:scale-95"
                                >
                                    <TrashIcon className="text-rose-300" />
                                    <span className="text-sm font-medium">Borrar</span>
                                </button>
                            )}
                        </div>

                        <button
                            onClick={onBack}
                            className="flex items-center gap-2 px-6 py-2 rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-95"
                        >
                            <BackIcon className="text-white" />
                            <span className="text-sm font-medium text-white">Volver al Inicio</span>
                        </button>
                    </div>
                </div>
            );
        };

        /* ==================================================================
           VISTA PUBLICAR
           ================================================================== */
        const PublishView = ({ session, onBack, onPublished, showToast }) => {
            const [title, setTitle] = useState("");
            const [dedicatory, setDedicatory] = useState("");
            const [author, setAuthor] = useState(session && session.email ? session.email.split("@")[0] : "");
            const [theme, setTheme] = useState("rosa");
            const [body, setBody] = useState("");
            const [badge, setBadge] = useState("");
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState("");

            const t = THEMES[theme];
            const previewLines = body.split("\n").filter((l) => l.trim()).slice(0, 5);

            const handlePublish = async (e) => {
                e.preventDefault();
                setError("");
                const lines = body.split("\n").map((l) => l.trim());
                if (!title.trim()) { setError("El poema necesita un título"); return; }
                if (!lines.filter((l) => l).length) { setError("Escribe al menos un verso"); return; }
                setBusy(true);
                try {
                    const { data, error } = await db
                        .from("poems")
                        .insert({
                            title: title.trim(),
                            dedicatory: dedicatory.trim() || null,
                            author: author.trim() || "Anónimo",
                            theme,
                            lines,
                            badge: badge.trim() || null,
                            columns: false,
                            user_id: session.id,
                        })
                        .select()
                        .single();
                    if (error) throw error;
                    showToast("Poema publicado ✨");
                    onPublished(normalizeDbRow(data));
                } catch (err) {
                    setError(err.message || "No se pudo publicar");
                } finally {
                    setBusy(false);
                }
            };

            const inputClass = "w-full bg-white/10 rounded-xl px-4 py-3 placeholder-white/40 outline-none focus:ring-2 focus:ring-pink-400 transition";

            return (
                <div className="relative z-10 w-full max-w-5xl flex flex-col items-center">
                    <button
                        onClick={onBack}
                        className="self-start mb-4 flex items-center gap-2 px-5 py-2 rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-95"
                    >
                        <BackIcon className="text-white w-5 h-5" />
                        <span className="text-sm font-medium text-white">Volver al menú</span>
                    </button>

                    <div className="w-full grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
                        {/* Formulario */}
                        <form onSubmit={handlePublish} className="bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl border border-white/10 p-6 md:p-8 space-y-4">
                            <h2 className="text-3xl font-dancing text-pink-300 mb-2">Publicar un poema</h2>

                            <input
                                type="text"
                                placeholder="Título del poema"
                                value={title}
                                onChange={(e) => setTitle(e.target.value)}
                                className={inputClass}
                                maxLength={80}
                            />
                            <input
                                type="text"
                                placeholder="Dedicatoria (opcional)"
                                value={dedicatory}
                                onChange={(e) => setDedicatory(e.target.value)}
                                className={inputClass}
                                maxLength={120}
                            />
                            <div className="grid grid-cols-2 gap-4">
                                <input
                                    type="text"
                                    placeholder="Tu nombre"
                                    value={author}
                                    onChange={(e) => setAuthor(e.target.value)}
                                    className={inputClass}
                                    maxLength={60}
                                />
                                <input
                                    type="text"
                                    placeholder="Número o símbolo (opcional)"
                                    value={badge}
                                    onChange={(e) => setBadge(e.target.value)}
                                    className={inputClass}
                                    maxLength={4}
                                />
                            </div>

                            <div>
                                <p className="text-sm text-white/60 mb-2">Tema visual</p>
                                <div className="flex flex-wrap gap-2">
                                    {THEME_KEYS.map((key) => (
                                        <button
                                            type="button"
                                            key={key}
                                            onClick={() => setTheme(key)}
                                            className={`bg-gradient-to-r ${THEMES[key].chip} px-4 py-2 rounded-full text-sm font-medium transition-all
                                                ${theme === key ? "ring-2 ring-white scale-105" : "opacity-60 hover:opacity-100"}`}
                                        >
                                            {THEMES[key].name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <textarea
                                placeholder={"Escribe tu poema aquí…\nUna línea por verso."}
                                value={body}
                                onChange={(e) => setBody(e.target.value)}
                                rows={10}
                                className={`${inputClass} resize-y`}
                            />

                            {error && <p className="text-rose-300 text-sm">{error}</p>}

                            <button
                                type="submit"
                                disabled={busy}
                                className="w-full bg-gradient-to-r from-pink-500 to-purple-600 py-3 rounded-xl font-medium hover:from-pink-600 hover:to-purple-700 transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2"
                            >
                                <PenIcon className="w-5 h-5" />
                                {busy ? "Publicando…" : "Publicar poema"}
                            </button>
                        </form>

                        {/* Vista previa en vivo */}
                        <div className={`lg:sticky lg:top-6 rounded-3xl overflow-hidden shadow-2xl border ${t.border} bg-white/10 backdrop-blur-md`}>
                            <div className={`h-2 w-full bg-gradient-to-r ${t.chip}`}></div>
                            <div className={`h-28 bg-gradient-to-b ${t.cardHeader} flex items-center justify-center flex-col px-4`}>
                                {badge.trim() ? (
                                    <div className={`text-5xl font-bold ${t.accent}`}>{badge}</div>
                                ) : (
                                    <FeatherIcon className={`${t.accent} opacity-80 w-12 h-12`} />
                                )}
                                <h3 className={`mt-2 text-2xl ${t.titleFont} ${t.accent}`}>{title || "Tu título aquí"}</h3>
                                {dedicatory && <p className={`font-dancing italic text-xs ${t.caption}`}>{dedicatory}</p>}
                            </div>
                            <div className="px-6 py-5 text-center space-y-1 min-h-[180px]">
                                {previewLines.length ? (
                                    previewLines.map((line, i) => (
                                        <p key={i} className={`${t.bodyFont} text-lg ${i % 2 === 0 ? t.lineA : t.lineB} opacity-90`}>
                                            {line}
                                        </p>
                                    ))
                                ) : (
                                    <p className={`${t.bodyFont} text-lg ${t.lineB} opacity-40`}>La vista previa de tu poema aparecerá aquí…</p>
                                )}
                            </div>
                            <div className="bg-black/20 px-6 py-3 text-center text-xs text-white/50 border-t border-white/5">
                                — {author || "Anónimo"} · Tema: {t.name}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ==================================================================
           APP PRINCIPAL
           ================================================================== */
        const App = () => {
            const [view, setView] = useState("menu"); // 'menu' | 'reader' | 'publish'
            const [poemId, setPoemId] = useState(null);
            const [poems, setPoems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [session, setSession] = useState(null);
            const [authModal, setAuthModal] = useState(null); // null | 'login' | 'signup'
            const [toast, setToast] = useState(null);
            const [likes, setLikes] = useState(() => {
                try { return JSON.parse(localStorage.getItem("poem_likes") || "{}"); }
                catch (e) { return {}; }
            });

            const showToast = (msg) => setToast({ msg, id: Date.now() });

            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(null), 2600);
                return () => clearTimeout(t);
            }, [toast]);

            // Carga inicial: los objetos de poema salen de poemas.xlsx.
            // Si hay Supabase configurado, se intenta la BD y se siembra
            // con el contenido del Excel la primera vez (tabla vacía).
            useEffect(() => {
                let alive = true;
                (async () => {
                    let localPoems = [];
                    try {
                        localPoems = await loadPoemsFromXlsx(XLSX_FILE);
                    } catch (err) {
                        console.error(err);
                        if (alive) showToast("No se pudo leer poemas.xlsx");
                    }
                    if (!alive) return;

                    if (!db) {
                        setPoems(localPoems);
                        setLoading(false);
                        return;
                    }

                    try {
                        const { data } = await db.auth.getSession();
                        if (alive) setSession(data.session ? data.session.user : null);
                        db.auth.onAuthStateChange((_event, s) => {
                            if (alive) setSession(s ? s.user : null);
                        });

                        let { data: rows, error } = await db
                            .from("poems")
                            .select("*")
                            .order("created_at", { ascending: true });
                        if (error) throw error;

                        // Primera conexión: sembrar la BD con los poemas del Excel
                        if (!rows || rows.length === 0) {
                            if (localPoems.length) {
                                const { data: created, error: insErr } = await db
                                    .from("poems")
                                    .insert(localPoems.map(poemToDbRow))
                                    .select();
                                if (insErr) console.error("Error sembrando poemas:", insErr);
                                rows = created || [];
                            } else {
                                rows = [];
                            }
                        }

                        if (alive) {
                            setPoems(rows.map(normalizeDbRow));
                            setLoading(false);
                        }
                    } catch (err) {
                        console.error(err);
                        if (alive) {
                            setPoems(localPoems); // Sin conexión: el Excel manda
                            setLoading(false);
                            showToast("Sin conexión con la BD: mostrando poemas.xlsx");
                        }
                    }
                })();
                return () => { alive = false; };
            }, []);

            const toggleLike = (id) => {
                setLikes((prev) => {
                    const next = { ...prev, [id]: !prev[id] };
                    localStorage.setItem("poem_likes", JSON.stringify(next));
                    return next;
                });
            };

            const currentPoem = poems.find((p) => p.id === poemId);
            const themeKey = view === "reader" && currentPoem ? currentPoem.theme : "rosa";

            const requireDb = () => {
                if (!db) { showToast("Configura Supabase en index.html para usar cuentas"); return false; }
                return true;
            };

            const handleDeletePoem = async () => {
                if (!currentPoem) return;
                const { error } = await db.from("poems").delete().eq("id", currentPoem.id);
                if (error) { showToast("No se pudo borrar"); return; }
                setPoems((prev) => prev.filter((p) => p.id !== currentPoem.id));
                setView("menu");
                showToast("Poema borrado");
            };

            // Carga poemas desde un archivo .xlsx elegido por el usuario
            const handleUploadXlsx = async (file) => {
                try {
                    const imported = poemsFromWorkbook(XLSX.read(await file.arrayBuffer(), { type: "array" }));
                    if (!imported.length) { showToast("El Excel no contiene poemas"); return; }

                    if (!db) {
                        setPoems(imported);
                        setView("menu");
                        showToast(`Cargados ${imported.length} poemas del Excel`);
                        return;
                    }

                    // En BD: añade solo los poemas cuyo título no exista aún
                    const { data: existing, error: selErr } = await db.from("poems").select("title");
                    if (selErr) throw selErr;
                    const titles = new Set((existing || []).map((r) => r.title));
                    const nuevos = imported
                        .filter((p) => !titles.has(p.title))
                        .map((p) => ({ ...poemToDbRow(p), user_id: session ? session.id : null }));

                    if (!nuevos.length) { showToast("Todos los poemas del Excel ya existen"); return; }

                    const { data: created, error } = await db.from("poems").insert(nuevos).select();
                    if (error) throw error;
                    setPoems((prev) => [...prev, ...(created || []).map(normalizeDbRow)]);
                    showToast(`${created.length} poemas añadidos desde el Excel`);
                } catch (err) {
                    console.error(err);
                    showToast("No se pudo leer el Excel");
                }
            };

            return (
                <div className="min-h-screen relative flex flex-col items-center p-4 md:p-8">
                    <Backdrop themeKey={themeKey} />

                    {/* Aviso de modo local */}
                    {!db && view === "menu" && (
                        <div className="relative z-10 w-full max-w-4xl mb-4 text-center text-xs md:text-sm bg-amber-500/15 border border-amber-300/30 text-amber-200 rounded-2xl px-4 py-2">
                            Modo local: los poemas salen de <b>poemas.xlsx</b>. Añade tus claves de Supabase en <b>index.html</b> (y ejecuta <b>supabase-setup.sql</b>) para activar el login y publicar en línea.
                        </div>
                    )}

                    {/* Barra superior */}
                    <header className="relative z-10 w-full max-w-5xl flex flex-col md:flex-row justify-between items-center gap-3 mb-8">
                        <button
                            onClick={() => setView("menu")}
                            className="flex items-center gap-3 group"
                        >
                            <FeatherIcon className="text-pink-300 opacity-80 w-8 h-8 transition-transform duration-700 group-hover:rotate-12" />
                            <div className="text-left">
                                <div className="text-xl font-dancing text-white/90 leading-none">Tu Existencia</div>
                                <div className="text-[10px] uppercase tracking-[0.25em] text-pink-200/60">Colección de poemas</div>
                            </div>
                        </button>

                        <div className="flex items-center gap-2">
                            {/* Cargar Excel: en modo local siempre; con BD, solo usuarios con sesión */}
                            {(session || !db) && (
                                <label className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 font-medium text-sm transition-all active:scale-95 cursor-pointer">
                                    <SheetIcon className="w-4 h-4" />
                                    Cargar Excel
                                    <input
                                        type="file"
                                        accept=".xlsx,.xls"
                                        className="hidden"
                                        onChange={(e) => {
                                            const file = e.target.files && e.target.files[0];
                                            if (file) handleUploadXlsx(file);
                                            e.target.value = "";
                                        }}
                                    />
                                </label>
                            )}

                            <button
                                onClick={() => {
                                    if (!requireDb()) return;
                                    if (session) setView("publish");
                                    else setAuthModal("login");
                                }}
                                className="flex items-center gap-2 px-4 py-2 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 font-medium text-sm shadow-lg hover:from-pink-600 hover:to-purple-700 transition-all active:scale-95"
                            >
                                <PenIcon className="w-4 h-4" />
                                Publicar poema
                            </button>

                            {session ? (
                                <div className="flex items-center gap-2 bg-white/10 rounded-full pl-3 pr-1 py-1">
                                    <UserIcon className="text-pink-200" />
                                    <span className="text-xs text-white/80 max-w-[120px] truncate">{session.email}</span>
                                    <button
                                        onClick={async () => { await db.auth.signOut(); showToast("Sesión cerrada"); }}
                                        className="text-xs bg-white/10 hover:bg-white/20 rounded-full px-3 py-1 transition-colors"
                                    >
                                        Salir
                                    </button>
                                </div>
                            ) : (
                                <button
                                    onClick={() => { if (!requireDb()) return; setAuthModal("login"); }}
                                    className="flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 font-medium text-sm transition-all active:scale-95"
                                >
                                    <UserIcon />
                                    Iniciar sesión
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Contenido por vista */}
                    {view === "menu" && (
                        <main className="relative z-10 w-full max-w-5xl">
                            {loading ? (
                                <div className="flex justify-center py-20">
                                    <div className="animate-float text-center">
                                        <FeatherIcon className="text-pink-300 opacity-70 mx-auto" />
                                        <p className="mt-4 text-white/50 font-dancing text-xl">Abriendo el libro de poemas…</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {poems.map((poem, i) => (
                                        <PoemCard
                                            key={poem.id}
                                            poem={poem}
                                            index={i}
                                            onOpen={(id) => { setPoemId(id); setView("reader"); }}
                                        />
                                    ))}
                                    {!db && (
                                        <div className="animate-fade-up rounded-3xl border border-dashed border-white/20 flex flex-col items-center justify-center p-8 text-center text-white/40" style={{ animationDelay: `${poems.length * 90}ms` }}>
                                            <PenIcon className="w-8 h-8 mb-3" />
                                            <p className="text-sm">Añade más poemas editando poemas.xlsx o con “Cargar Excel”</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                    )}

                    {view === "reader" && currentPoem && (
                        <main className="relative z-10 w-full flex justify-center">
                            <Reader
                                poem={currentPoem}
                                session={session}
                                liked={!!likes[currentPoem.id]}
                                onToggleLike={() => toggleLike(currentPoem.id)}
                                onBack={() => setView("menu")}
                                onDelete={handleDeletePoem}
                                showToast={showToast}
                            />
                        </main>
                    )}

                    {view === "publish" && (
                        <main className="relative z-10 w-full flex justify-center">
                            {session ? (
                                <PublishView
                                    session={session}
                                    onBack={() => setView("menu")}
                                    showToast={showToast}
                                    onPublished={(poem) => {
                                        setPoems((prev) => [...prev, poem]);
                                        setPoemId(poem.id);
                                        setView("reader");
                                    }}
                                />
                            ) : (
                                <div className="text-center bg-white/10 backdrop-blur-md rounded-3xl border border-white/10 p-10 max-w-sm">
                                    <UserIcon className="mx-auto text-pink-300 w-10 h-10 mb-4" />
                                    <p className="font-dancing text-2xl text-pink-200 mb-2">Inicia sesión para publicar</p>
                                    <p className="text-sm text-white/60 mb-6">Así cada poema guarda su autor y puedes borrar los tuyos.</p>
                                    <button
                                        onClick={() => setAuthModal("login")}
                                        className="bg-gradient-to-r from-pink-500 to-purple-600 px-8 py-3 rounded-full font-medium hover:from-pink-600 hover:to-purple-700 transition-all active:scale-95"
                                    >
                                        Iniciar sesión
                                    </button>
                                </div>
                            )}
                        </main>
                    )}

                    {/* Pie */}
                    <div className="relative z-10 mt-10 mb-4 text-white/20 text-xs text-center font-light">
                        Hecho con el corazón
                    </div>

                    {/* Modal de autenticación */}
                    {authModal && (
                        <AuthModal
                            mode={authModal}
                            onClose={() => setAuthModal(null)}
                            onSwitchMode={setAuthModal}
                            onAuthed={() => setAuthModal(null)}
                            showToast={showToast}
                        />
                    )}

                    {/* Toast */}
                    <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-purple-900 px-6 py-3 rounded-full shadow-2xl font-medium transform transition-all duration-500 z-[60]
                        ${toast ? "translate-y-0 opacity-100 scale-100" : "translate-y-20 opacity-0 scale-95"}`}>
                        {toast ? toast.msg : ""}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
